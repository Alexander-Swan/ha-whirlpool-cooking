name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
